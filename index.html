<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的推荐链接</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #24292f;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #6a737d; font-size: 14px; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid #e1e4e8;
    border-radius: 10px;
    padding: 20px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: box-shadow .15s, border-color .15s, transform .15s;
  }
  .card:hover {
    border-color: #0969da;
    box-shadow: 0 4px 12px rgba(9,105,218,.12);
    transform: translateY(-2px);
  }
  .card .name { font-size: 16px; font-weight: 600; }
  .card .desc { font-size: 13px; color: #6a737d; line-height: 1.5; }
  .card .go { font-size: 13px; color: #0969da; margin-top: auto; }
  footer { text-align: center; margin-top: 40px; font-size: 12px; color: #959da5; }
</style>
</head>
<body>
<div class="container">
  <h1>我的推荐链接</h1>
  <p class="subtitle">通过以下链接注册，对站长会有少量支持，感谢！</p>
  <div class="grid" id="links"></div>
  <footer>页面由站长维护，链接长期有效</footer>
</div>

<!-- 只需要改这里：往数组里加/删你的 AFF 链接即可 -->
<script>
const LINKS = [
  { name: "站点名称 1", url: "https://example.com/aff?code=xxxx", desc: "一句话介绍这个站点是干嘛的" },
  { name: "站点名称 2", url: "https://example2.com/aff?code=yyyy", desc: "一句话介绍" },
  { name: "站点名称 3", url: "https://example3.com/aff?code=zzzz", desc: "一句话介绍" },
];

const box = document.getElementById("links");
for (const l of LINKS) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = l.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML =
    '<span class="name"></span><span class="desc"></span><span class="go">前往注册 →</span>';
  a.querySelector(".name").textContent = l.name;
  a.querySelector(".desc").textContent = l.desc;
  box.appendChild(a);
}
</script>
</body>
</html>
