<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好用的公益站汇总</title>
<style>
  :root {
    --text:   #1b1f27;
    --text-2: #5c6575;
    --muted:  #99a2b1;
    --card:   rgba(255,255,255,.72);
    --border: rgba(30,41,72,.09);
    --accent: #4f6bf5;
    --accent-weak: rgba(79,107,245,.10);
    --warn:   #b45309;
    --warn-weak: rgba(245,158,11,.13);
    --glow-1: rgba(99,102,241,.16);
    --glow-2: rgba(34,211,238,.12);
    --shadow: 0 10px 30px rgba(30,41,72,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text:   #e8ebf2;
      --text-2: #a3adc0;
      --muted:  #6d7689;
      --card:   rgba(255,255,255,.045);
      --border: rgba(255,255,255,.09);
      --accent: #7d93ff;
      --accent-weak: rgba(125,147,255,.12);
      --warn:   #fbbf24;
      --warn-weak: rgba(251,191,36,.10);
      --glow-1: rgba(99,102,241,.22);
      --glow-2: rgba(34,211,238,.10);
      --shadow: 0 12px 32px rgba(0,0,0,.45);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 56px 20px 48px;
    background:
      radial-gradient(640px 420px at 12% -8%, var(--glow-1), transparent 65%),
      radial-gradient(720px 480px at 92% 4%, var(--glow-2), transparent 60%),
      #f7f8fb;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    body { background-color: #0b0e15; }
  }

  .container { max-width: 780px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  header { text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; letter-spacing: .5px;
    color: var(--accent);
    background: var(--accent-weak);
    padding: 6px 14px; border-radius: 999px;
    margin-bottom: 18px;
  }
  .badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.8); }
  }
  h1 {
    font-size: clamp(26px, 5.4vw, 36px);
    font-weight: 800; letter-spacing: .5px;
  }
  h1 .grad {
    background: linear-gradient(120deg, #6366f1, #22d3ee);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .subtitle {
    margin: 12px auto 0; max-width: 560px;
    font-size: 15px; line-height: 1.75; color: var(--text-2);
  }

  /* ---------- 额度提示条 ---------- */
  .tip {
    margin: 26px auto 0;
    display: flex; gap: 12px; align-items: flex-start;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--accent-weak);
    font-size: 13.5px; line-height: 1.7; color: var(--text-2);
    text-align: left;
  }
  .tip .icon { font-size: 18px; line-height: 1.4; }
  .tip b { color: var(--text); font-weight: 600; }

  /* ---------- 分组 ---------- */
  .section { margin-top: 40px; }
  .sec-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 17px; font-weight: 800; letter-spacing: .3px;
  }
  .sec-title::before {
    content: ""; width: 4px; height: 17px; border-radius: 2px;
    background: linear-gradient(180deg, #6366f1, #22d3ee);
  }
  .sec-note {
    margin-top: 8px; font-size: 12.5px; line-height: 1.7;
    color: var(--muted); max-width: 660px;
  }

  /* ---------- 站点卡片 ---------- */
  .grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    padding: 22px 22px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    text-decoration: none; color: inherit;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 2px 10px rgba(30,41,72,.04);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation: rise .55s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow: var(--shadow);
    outline: none;
  }
  .row { display: flex; align-items: center; gap: 13px; }
  .avatar {
    flex: none;
    width: 44px; height: 44px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 19px; font-weight: 700;
    box-shadow: inset 0 -8px 14px rgba(0,0,0,.14);
  }
  .name { font-size: 16.5px; font-weight: 700; letter-spacing: .2px; }
  .status {
    margin-left: auto; flex: none;
    font-size: 11px; font-weight: 600;
    color: var(--warn); background: var(--warn-weak);
    padding: 3.5px 10px; border-radius: 999px;
  }
  .desc { font-size: 13.5px; line-height: 1.7; color: var(--text-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .tag {
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    color: var(--accent);
    padding: 3px 9px; border-radius: 999px;
    background: var(--accent-weak);
  }
  .stats { display: flex; gap: 8px; margin-top: 2px; }
  .stat {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border-radius: 10px;
    background: var(--accent-weak);
    font-size: 12.5px; color: var(--text-2);
    white-space: nowrap;
  }
  .stat b { color: var(--accent); font-weight: 700; }
  .meta { margin-top: 2px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .go {
    margin-top: auto; padding-top: 12px;
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .go svg { transition: transform .18s ease; }
  .card:hover .go svg { transform: translate(3px, -3px); }

  /* ---------- 空状态 / 页脚 ---------- */
  .empty {
    grid-column: 1 / -1; text-align: center;
    padding: 48px 20px; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--border); border-radius: 18px;
  }
  footer {
    margin-top: 44px; text-align: center;
    font-size: 12.5px; color: var(--muted); line-height: 1.9;
  }
  footer .count { color: var(--accent); font-weight: 600; }

  @media (max-width: 480px) {
    body { padding: 40px 16px 36px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <span class="badge"><span class="dot"></span>持续更新</span>
    <h1>好用的<span class="grad">公益站</span>汇总</h1>
    <p class="subtitle">我自己在用、体验不错的公益站都收集在这里，长期维护这份清单。</p>
  </header>

  <div class="tip">
    <span class="icon">💡</span>
    <span><b>从下方邀请链接注册，可获得比直接注册更多的初始额度</b>，且不损失你本身的任何权益；公益站额度主要靠每日签到积累，注册后记得天天签到。点击卡片即可直达注册页。</span>
  </div>

  <main id="main"></main>

  <footer id="footer"></footer>
</div>

<!-- ================================================================
     在这里维护站点数据（其他地方都不用动）
     GROUPS: 分组列表，每组 { title, note(可省略), sites: [...] }
     每个站点支持以下字段（除 name/url 外都可省略）：
       name    站点名          url     邀请链接
       desc    一句话介绍      models  支持的模型（标签）
       signup  注册方式        price   参考价格
       bonus   注册赠送        daily   每日签到额度
       nomodel 填 true 显示「暂无模型」标记
================================================================= -->
<script>
const GROUPS = [
  {
    title: "综合推荐",
    sites: [
      {
        name: "Any Router",
        url: "https://anyrouter.top/register?aff=YKzT",
        desc: "公认最强公益站，API 计费纯正、上新模型最快；高峰期调用需排队，体验会有些卡顿。",
        models: ["gpt-6", "fable-5.1"],
        signup: "Linux.do / 国内教育邮箱",
        price: "参考 入 $4/M · 出 $2/M",
        bonus: "$75",
        daily: "$25",
      },
      {
        name: "Agent Router",
        url: "https://agentrouter.org/register?aff=4ReK",
        desc: "模型覆盖面广，日常使用丝滑；GPT 与 Opus 每日全站限量。",
        models: ["gpt-5.6", "opus-5", "glm-5.3", "deepseek-v4-flash"],
        signup: "Linux.do / GitHub ≥1 年",
        price: "参考 入 $3/M · 出 $15/M",
        bonus: "$50",
        daily: "$25",
      },
    ],
  },
  {
    title: "TaBiAI 系列 · 同一站长",
    note: "同一站长运营的四站，注册赠送与签到额度各不相同；价格随模型浮动，以下均为参考。目前除 JustDoWork 外暂未上架模型。",
    sites: [
      {
        name: "TaBiAI",
        url: "https://tabitoken.com/sign-up?aff=1UkR",
        desc: "系列主站，注册赠送额度最高；按请求计费，thinking 模型略贵。",
        bonus: "$100",
        daily: "$5-10",
        price: "参考 ~$0.35/请求（thinking $0.4）",
        nomodel: true,
      },
      {
        name: "GoRouter",
        url: "https://gorouter.app/sign-up?aff=dj8W",
        desc: "系列中单价最低的按请求计费站。",
        bonus: "$50",
        daily: "$5-10",
        price: "参考 ~$0.2/请求",
        nomodel: true,
      },
      {
        name: "JustDoWork",
        url: "https://api.justwoker.icu/register?aff=6gq7",
        desc: "系列中目前唯一上架模型的站，按 token 计费，签到额度也最高。",
        models: ["gpt-5.6sol"],
        bonus: "$70",
        daily: "$25-30",
        price: "参考 入/出 $0.65/M",
      },
      {
        name: "KKToken AI",
        url: "https://kktoken.cc/sign-up?aff=lwvh",
        desc: "按 token 计费，签到额度稳定。",
        bonus: "$75",
        daily: "$20",
        price: "参考 入/出 $1/M",
        nomodel: true,
      },
    ],
  },
];

const GRADS = [
  "linear-gradient(135deg,#6366f1,#8b5cf6)",
  "linear-gradient(135deg,#0ea5e9,#22d3ee)",
  "linear-gradient(135deg,#f59e0b,#f97316)",
  "linear-gradient(135deg,#10b981,#14b8a6)",
  "linear-gradient(135deg,#ec4899,#f43f5e)",
];
const ARROW = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>';

const main = document.getElementById("main");
let idx = 0;
const total = GROUPS.reduce((n, g) => n + g.sites.length, 0);

if (total === 0) {
  const e = document.createElement("div");
  e.className = "empty";
  e.textContent = "清单整理中，敬请期待～";
  main.appendChild(e);
}

GROUPS.forEach(g => {
  if (g.sites.length === 0) return;

  const sec = document.createElement("div");
  sec.className = "section";

  if (g.title) {
    const t = document.createElement("div");
    t.className = "sec-title";
    t.textContent = g.title;
    sec.appendChild(t);
  }
  if (g.note) {
    const n = document.createElement("p");
    n.className = "sec-note";
    n.textContent = g.note;
    sec.appendChild(n);
  }

  const grid = document.createElement("div");
  grid.className = "grid";

  g.sites.forEach(l => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.style.animationDelay = (idx * 70) + "ms";

    const row = document.createElement("div");
    row.className = "row";

    const av = document.createElement("span");
    av.className = "avatar";
    av.style.background = GRADS[idx % GRADS.length];
    av.textContent = (l.name || "?").trim().charAt(0);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = l.name;

    row.appendChild(av);
    row.appendChild(name);

    if (l.nomodel) {
      const st = document.createElement("span");
      st.className = "status";
      st.textContent = "暂无模型";
      row.appendChild(st);
    }
    a.appendChild(row);

    if (l.desc) {
      const desc = document.createElement("span");
      desc.className = "desc";
      desc.textContent = l.desc;
      a.appendChild(desc);
    }

    if (Array.isArray(l.models) && l.models.length) {
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const t of l.models) {
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = t;
        tags.appendChild(s);
      }
      a.appendChild(tags);
    }

    if (l.bonus || l.daily) {
      const stats = document.createElement("div");
      stats.className = "stats";
      if (l.bonus) {
        const s = document.createElement("span");
        s.className = "stat";
        s.append("🎁 注册送 ");
        const b = document.createElement("b");
        b.textContent = l.bonus;
        s.appendChild(b);
        stats.appendChild(s);
      }
      if (l.daily) {
        const s = document.createElement("span");
        s.className = "stat";
        s.append("📅 签到 ");
        const b = document.createElement("b");
        b.textContent = l.daily;
        s.appendChild(b);
        stats.appendChild(s);
      }
      a.appendChild(stats);
    }

    const meta = [l.signup, l.price].filter(Boolean).join("　·　");
    if (meta) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      a.appendChild(m);
    }

    const go = document.createElement("span");
    go.className = "go";
    go.append("前往注册 ");
    go.insertAdjacentHTML("beforeend", ARROW);
    a.appendChild(go);

    grid.appendChild(a);
    idx++;
  });

  sec.appendChild(grid);
  main.appendChild(sec);
});

document.getElementById("footer").innerHTML =
  '已收录 <span class="count">' + total + '</span> 个站点 · 由 AbyssWhalen 整理维护<br>价格与赠送额度可能随时间调整，以各站实际页面为准 · 欢迎分享给有需要的朋友';
</script>
</body>
</html>
